[project]
name = "hackalem-menelai-pipeline"
version = "0.1.0"
description = "Граф денег (AML): воспроизводимый пайплайн ролей, кластеров и приоритета"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "networkx>=3.3",
    "numpy>=1.26",
    "scipy>=1.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
